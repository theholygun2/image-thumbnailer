name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  infra:
    name: Infra checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1

      - name: Format check
        run: tofu fmt -check -recursive -diff infra

      # The lambda module reads the zip at validate time, but dist/ is gitignored.
      - name: Placeholder Lambda zip
        run: |
          mkdir -p apps/worker/dist
          touch apps/worker/dist/worker.zip

      - name: Validate each environment
        run: |
          for dir in infra/envs/*/; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

  api:
    name: API typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p apps/api/tsconfig.json