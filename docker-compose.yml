services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    ports:
      # Local: 3000. On EC2: HOST_PORT=80 docker compose up -d
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
    # Local testing only: containers can't see your AWS CLI login, so uncomment
    # these to reuse it. On EC2, leave them out; the instance role is used.
    # environment:
    #   AWS_PROFILE: ${AWS_PROFILE:-default}
    # volumes:
    #   - ~/.aws:/home/bun/.aws:ro